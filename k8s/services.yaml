apiVersion: v1
kind: Service
metadata:
  name: genesis-backend
  namespace: genesis
  labels:
    app: genesis-backend
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app: genesis-backend
---
apiVersion: v1
kind: Service
metadata:
  name: genesis-frontend
  namespace: genesis
  labels:
    app: genesis-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: genesis-frontend
