apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-oc-grey-6e28-7fd8bc7659-5g6gt
  namespace: genesis
  labels:
    app: openclaw-oc-grey-6e28-7fd8bc7659-5g6gt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-oc-grey-6e28-7fd8bc7659-5g6gt
  template:
    metadata:
      labels:
        app: openclaw-oc-grey-6e28-7fd8bc7659-5g6gt
    spec:
      containers:
      - name: agent
        image: docker.io/library/openclaw-genesis-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: webhook
        env:
        - name: OWNER_TOKEN
          value: "BjE_PwKyOCr6KvPMcdO9Qw7lLYLJuqC_RY0iWj7eVo8"
        - name: AGENT_API_KEY
          value: "47ZtxmjqSV-XzK5CzfD8RZfdzR4PaK-PWJGudITVMrA"
        - name: EXTERNAL_ID
          value: "openclaw-oc-grey-6e28-7fd8bc7659-5g6gt"
        - name: AGENT_MODE
          value: "kubernetes"
        - name: GENESIS_API
          value: "http://genesis-backend.genesis.svc.cluster.local:4000"
        - name: AGENT_WEBHOOK_URL
          value: "http://openclaw-oc-grey-6e28-7fd8bc7659-5g6gt.genesis.svc.cluster.local:3000/webhook"
        - name: HEARTBEAT_INTERVAL
          value: "30000"
        - name: SCAN_INTERVAL
          value: "60000"
        - name: OPENCLAW_BRIDGE_URL
          value: "http://openclaw-bridge.openclaw-cloud.svc.cluster.local:8080"
        - name: LOG_LEVEL
          value: "info"
        - name: MIN_PROFIT_MARGIN
          value: "0.2"
        - name: MARKET_RATE
          value: "50"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-oc-grey-6e28-7fd8bc7659-5g6gt
  namespace: genesis
spec:
  selector:
    app: openclaw-oc-grey-6e28-7fd8bc7659-5g6gt
  ports:
  - port: 3000
    targetPort: 3000
    name: webhook
