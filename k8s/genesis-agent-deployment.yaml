# Genesis Agent Deployment
# 独立的 Agent 服务，负责扫描任务、生成报价、执行任务

apiVersion: apps/v1
kind: Deployment
metadata:
  name: genesis-agent
  namespace: genesis
  labels:
    app: genesis-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genesis-agent
  template:
    metadata:
      labels:
        app: genesis-agent
    spec:
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: docker.io/library/openclaw-genesis-agent:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: webhook
          env:
            # Agent 身份配置
            - name: AGENT_ID
              value: "dda57307-a8b3-414a-a523-eab192d2629f"
            - name: OWNER_TOKEN
              value: "BjE_PwKyOCr6KvPMcdO9Qw7lLYLJuqC_RY0iWj7eVo8"
            - name: AGENT_API_KEY
              value: "hJI7MYALSJrhhnHf9MfgqQK7d2QiKmjAEmH9ps6umQM"
            
            # 持久化标识：用于 Pod 重启后保持 AGENT_ID
            # 如果不设置，会自动从 HOSTNAME 生成
            - name: EXTERNAL_ID
              value: "genesis-agent-main"
            
            # Agent 模式：kubernetes 或 external
            - name: AGENT_MODE
              value: "kubernetes"
            
            # Genesis 后端 API
            - name: GENESIS_API
              value: "http://genesis-backend.genesis.svc.cluster.local:4000"
            
            # Webhook 配置
            - name: AGENT_WEBHOOK_URL
              value: "http://genesis-agent.genesis.svc.cluster.local:3000/webhook"
            
            # 服务间隔配置
            - name: HEARTBEAT_INTERVAL
              value: "30000"  # 30秒心跳
            - name: SCAN_INTERVAL
              value: "60000"  # 60秒扫描任务
            
            # Openclaw Bridge 配置
            - name: OPENCLAW_BRIDGE_URL
              value: "http://openclaw-bridge.openclaw-cloud.svc.cluster.local:8080"
            
            # 日志配置
            - name: LOG_LEVEL
              value: "info"
            
            # 报价配置
            - name: MIN_PROFIT_MARGIN
              value: "0.2"
            - name: MARKET_RATE
              value: "50"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: genesis-agent
  namespace: genesis
spec:
  selector:
    app: genesis-agent
  ports:
    - port: 3000
      targetPort: 3000
      name: webhook
  type: ClusterIP
