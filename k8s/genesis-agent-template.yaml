# Genesis Agent 模板 - 用于为每个用户创建独立的 Agent
# 使用方式：
#   export USER_ID="user-uuid"
#   export AGENT_ID="agent-uuid"
#   export EXTERNAL_ID="user-agent-unique-id"
#   export AGENT_API_KEY="api-key"
#   envsubst < genesis-agent-template.yaml | kubectl apply -f -

apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-${USER_ID}
  namespace: genesis
  labels:
    app: agent-${USER_ID}
    userId: ${USER_ID}
    agentId: ${AGENT_ID}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-${USER_ID}
      userId: ${USER_ID}
  template:
    metadata:
      labels:
        app: agent-${USER_ID}
        userId: ${USER_ID}
        agentId: ${AGENT_ID}
    spec:
      containers:
        - name: agent
          image: docker.io/library/openclaw-genesis-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: webhook
          env:
            - name: AGENT_ID
              value: "${AGENT_ID}"
            - name: OWNER_TOKEN
              value: "${OWNER_TOKEN}"
            - name: AGENT_API_KEY
              value: "${AGENT_API_KEY}"
            - name: EXTERNAL_ID
              value: "${EXTERNAL_ID}"
            - name: AGENT_MODE
              value: "kubernetes"
            - name: GENESIS_API
              value: "http://genesis-backend.genesis.svc.cluster.local:4000"
            - name: AGENT_WEBHOOK_URL
              value: "http://agent-${USER_ID}.genesis.svc.cluster.local:3000/webhook"
            - name: HEARTBEAT_INTERVAL
              value: "30000"
            - name: SCAN_INTERVAL
              value: "60000"
            - name: OPENCLAW_BRIDGE_URL
              value: "http://openclaw-bridge.openclaw-cloud.svc.cluster.local:8080"
            - name: LOG_LEVEL
              value: "info"
            - name: MIN_PROFIT_MARGIN
              value: "0.2"
            - name: MARKET_RATE
              value: "50"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agent-${USER_ID}
  namespace: genesis
  labels:
    app: agent-${USER_ID}
    userId: ${USER_ID}
spec:
  selector:
    app: agent-${USER_ID}
    userId: ${USER_ID}
  ports:
    - port: 3000
      targetPort: 3000
      name: webhook
  type: ClusterIP
