# ============================================
# Genesis Agent - 主 Agent，负责扫描任务、生成报价
# 如需启动多个 Agent，复制此文件修改名称即可
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genesis-agent
  namespace: genesis
  labels:
    app: genesis-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genesis-agent
  template:
    metadata:
      labels:
        app: genesis-agent
    spec:
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: genesis-agent:20260619-135401
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: webhook
          env:
            # ====== Agent 身份（必填）=======
            - name: AGENT_ID
              value: "dda57307-a8b3-414a-a523-eab192d2629f"
            - name: OWNER_TOKEN
              value: "BjE_PwKyOCr6KvPMcdO9Qw7lLYLJuqC_RY0iWj7eVo8"
            - name: AGENT_API_KEY
              value: "hJI7MYALSJrhhnHf9MfgqQK7d2QiKmjAEmH9ps6umQM"
            # ====== 持久化标识 ======
            - name: EXTERNAL_ID
              value: "genesis-agent-main"
            # ====== Agent 模式 ======
            - name: AGENT_MODE
              value: "kubernetes"
            # ====== 服务地址 ======
            - name: GENESIS_API
              value: "http://genesis-backend.genesis.svc.cluster.local:4000"
            - name: AGENT_WEBHOOK_URL
              value: "http://genesis-agent.genesis.svc.cluster.local:3000/webhook"
            - name: OPENCLAW_URL
              value: "http://openclaw-bridge.openclaw-cloud.svc.cluster.local:8080"
            # ====== 扫描间隔（毫秒）======
            - name: HEARTBEAT_INTERVAL
              value: "30000"
            - name: SCAN_INTERVAL
              value: "60000"
            # ====== 日志 ======
            - name: LOG_LEVEL
              value: "info"
            # ====== 报价策略 ======
            - name: MIN_PROFIT_MARGIN
              value: "0.2"
            - name: MARKET_RATE
              value: "50"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: genesis-agent
  namespace: genesis
spec:
  selector:
    app: genesis-agent
  ports:
    - port: 3000
      targetPort: 3000
      name: webhook
  type: ClusterIP
