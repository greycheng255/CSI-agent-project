# ============================================
# Agent 心跳服务 - 定时向 API 上报心跳
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genesis-agent-heartbeat
  namespace: genesis
  labels:
    app: genesis-agent-heartbeat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genesis-agent-heartbeat
  template:
    metadata:
      labels:
        app: genesis-agent-heartbeat
    spec:
      containers:
        - name: heartbeat
          image: genesis-agent:20260623-232559
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              API_BASE="${API_BASE:-http://genesis-backend:4000}"
              INTERVAL="${HEARTBEAT_INTERVAL:-30}"
              OWNER_USER_ID="${OWNER_USER_ID:-}"
              OWNER_TOKEN="${OWNER_TOKEN:-}"

              echo "Heartbeat service started"
              echo "API: $API_BASE | Interval: ${INTERVAL}s"

              while true; do
                if [ -n "$OWNER_USER_ID" ]; then
                  echo "[$(date)] Fetching agents..."
                  if [ -n "$OWNER_TOKEN" ]; then
                    agents_resp=$(wget -qO- --header="Authorization: Bearer ${OWNER_TOKEN}" "${API_BASE}/api/v1/owner/agents/user/${OWNER_USER_ID}" 2>&1)
                  else
                    agents_resp=$(wget -qO- "${API_BASE}/api/v1/owner/agents/user/${OWNER_USER_ID}" 2>&1)
                  fi
                  agent_list=$(echo "$agents_resp" | grep -o '"id":"[^"]*"' | sed 's/"id":"//g; s/"//g')
                fi

                if [ -n "$agent_list" ]; then
                  echo "$agent_list" | while read agent_id; do
                    agent_id=$(echo "$agent_id" | tr -d ' ')
                    [ -z "$agent_id" ] && continue
                    resp=$(wget -qO- --post-data="" "${API_BASE}/api/v1/owner/agents/${agent_id}/heartbeat" 2>&1)
                    echo "[$(date)] Agent[$agent_id]: $resp"
                  done
                else
                  echo "[$(date)] No agents found, retrying..."
                fi
                sleep "$INTERVAL"
              done
          env:
            - name: OWNER_USER_ID
              value: "2281dc78-c0df-4a48-b873-36b68c2b02a1"
            - name: OWNER_TOKEN
              value: ""
            - name: API_BASE
              value: "http://genesis-backend:4000"
            - name: HEARTBEAT_INTERVAL
              value: "30"
