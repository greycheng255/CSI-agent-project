# 镜像构建时间: 2026-06-23 23:25:59
# 镜像包: genesis-all_20260623-232559.tar
services:
  # ==================== 基础设施 ====================
  postgres:
    image: postgres:15-alpine
    container_name: genesis-postgres
    ports:
      - '5436:5432'
    environment:
      POSTGRES_USER: genesis_user
      POSTGRES_PASSWORD: genesis_password
      POSTGRES_DB: genesis_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - genesis-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis_user -d genesis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: genesis-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - genesis-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 业务服务 ====================
  genesis-backend:
    image: genesis-backend:${TAG:-20260623-232559}
    container_name: genesis-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: genesis_user
      DB_PASSWORD: genesis_password
      DB_NAME: genesis_db
      DB_SYNC: 'true'
      # 上传文件对外访问地址 (部署时改为实际域名或IP)
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL:-http://localhost}
      # 自动执行开关
      AUTO_EXECUTION_ENABLED: 'true'
      # OpenClaw Bridge 地址
      OPENCLAW_BRIDGE_URL: http://openclaw-bridge:8080
      # 管理员账号 (首次启动自动创建)
      ADMIN_PHONE: ${ADMIN_PHONE:-13800000001}
      OWNER_PHONE: ${OWNER_PHONE:-13900000002}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - genesis-net

  genesis-frontend:
    image: genesis-frontend:${TAG:-20260623-232559}
    container_name: genesis-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '80:80'
    depends_on:
      - genesis-backend
    restart: always
    networks:
      - genesis-net

  genesis-agent:
    image: genesis-agent:${TAG:-20260623-232559}
    container_name: genesis-agent
    build:
      context: ./genesis-agent
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      AGENT_ID: ${AGENT_ID:-}
      OWNER_TOKEN: ${OWNER_TOKEN:-}
      GENESIS_API: http://genesis-backend:4000
      OPENCLAW_URL: http://openclaw-bridge:8080
      SCAN_INTERVAL: '30000'
      HEARTBEAT_INTERVAL: '30000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIN_PROFIT_MARGIN: '0.2'
      MAX_DISCOUNT_RATE: '0.3'
      COMPETITIVE_ADJUSTMENT: 'true'
      URGENCY_BONUS: '0.1'
      MARKET_RATE: '50'
    depends_on:
      - genesis-backend
      - openclaw-bridge
    restart: always
    networks:
      - genesis-net

  openclaw-bridge:
    image: openclaw-bridge:${TAG:-20260623-232559}
    container_name: openclaw-bridge
    build:
      context: ./openclaw-bridge
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      GENESIS_BACKEND: http://genesis-backend:4000
      NODE_ENV: production
    depends_on:
      - genesis-backend
    restart: always
    networks:
      - genesis-net

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  genesis-net:
    driver: bridge

