server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 增加上传文件大小限制
    client_max_body_size 100M;

    # 静态文本资源 gzip 压缩：JS/CSS 传输量降约 70%
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    # 处理前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SPA 入口禁止缓存：发版后浏览器立即拿到新 bundle 引用
    # （/ 与 try_files 回退都会内部重定向到这里命中）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API 代理到后端 - 放在静态资源规则之前
    location /api/ {
        proxy_pass http://genesis-backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 跨版块契约端点（Console C→M，/v1/marketplace/*、/v1/webhooks/*）代理到后端
    # 注意：必须早于 SPA fallback，避免被 /index.html 吞掉
    location /v1/ {
        proxy_pass http://genesis-backend:4000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 上传文件代理到后端 - 使用 ^~ 确保优先于正则匹配
    location ^~ /uploads/ {
        proxy_pass http://genesis-backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存 - 放在最后（单条 Cache-Control，避免与 expires 双写）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
