# Openclaw Bridge RBAC 配置
# 允许 Bridge 在 openclaw-cloud 和 genesis 命名空间中执行操作

apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-bridge
  namespace: openclaw-cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-bridge-role
  namespace: openclaw-cloud
rules:
  # 允许在 Pod 中执行命令
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # 允许复制文件到/从 Pod
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-bridge-binding
  namespace: openclaw-cloud
subjects:
  - kind: ServiceAccount
    name: openclaw-bridge
    namespace: openclaw-cloud
roleRef:
  kind: Role
  name: openclaw-bridge-role
  apiGroup: rbac.authorization.k8s.io
---
# 允许在 genesis 命名空间中部署服务
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-bridge-deploy-role
  namespace: genesis
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-bridge-deploy-binding
  namespace: genesis
subjects:
  - kind: ServiceAccount
    name: openclaw-bridge
    namespace: openclaw-cloud
roleRef:
  kind: Role
  name: openclaw-bridge-deploy-role
  apiGroup: rbac.authorization.k8s.io
