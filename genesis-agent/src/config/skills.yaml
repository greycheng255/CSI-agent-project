# Agent 技能配置
# 通用技能框架 - Agent 可以处理任何任务，通过分析任务特征进行匹配

# 通用能力声明
agent_capabilities:
  name: "Genesis Universal Agent"
  version: "1.0.0"
  description: "通用任务处理 Agent，能够分析、理解并执行各类任务"
  
# 核心处理能力
core_skills:
  - name: task_analysis
    description: 任务需求分析和理解
    capabilities:
      - 提取任务关键需求
      - 识别技术栈要求
      - 评估任务复杂度
      - 估算工作量和时间
    
  - name: code_generation
    description: 代码生成和开发
    capabilities:
      - Python 脚本开发
      - Web 爬虫开发
      - 数据处理和分析
      - API 接口开发
      - 自动化脚本编写
      - Web 应用开发
      
  - name: data_processing
    description: 数据处理和处理
    capabilities:
      - 数据清洗和转换
      - CSV/Excel 处理
      - 数据库操作
      - 数据可视化
      
  - name: ai_integration
    description: AI 能力集成
    capabilities:
      - OpenAI API 调用
      - 大模型提示工程
      - 文本生成和处理
      - 智能数据分析

# 任务类型匹配规则
task_patterns:
  # 开发类任务
  - pattern: "(开发|编写|实现|创建|构建|搭建).*?(程序|脚本|工具|系统|网站|应用)"
    skill_category: code_generation
    confidence_boost: 0.9
    
  - pattern: "(爬虫|抓取|采集|爬取).*?(数据|信息|网页)"
    skill_category: code_generation
    confidence_boost: 0.95
    
  - pattern: "(数据|资料).*?(处理|清洗|整理|转换|分析)"
    skill_category: data_processing
    confidence_boost: 0.9
    
  - pattern: "(AI|人工智能|机器学习|深度学习|模型|算法)"
    skill_category: ai_integration
    confidence_boost: 0.85
    
  - pattern: "(API|接口|后端|服务|接口).*?(开发|实现|对接)"
    skill_category: code_generation
    confidence_boost: 0.9
    
  - pattern: "(自动化|自动|批量|定时).*?(处理|执行|运行)"
    skill_category: code_generation
    confidence_boost: 0.88

# 报价策略
pricing_strategy:
  # 基础费率（元/小时）
  base_rate_cny: 50
  
  # 复杂度系数
  complexity_multiplier:
    simple: 1.0      # 简单任务：1-3小时
    moderate: 1.5    # 中等任务：3-8小时
    complex: 2.5     # 复杂任务：8-20小时
    expert: 4.0      # 专家级任务：20+小时
    
  # 紧急程度加成
  urgency_multiplier:
    normal: 1.0
    urgent: 1.3      # 24小时内交付
    emergency: 1.8   # 12小时内交付
    
  # 最小利润率
  min_profit_margin: 0.2
  
  # 市场竞争调整
  market_adjustment:
    enabled: true
    max_discount: 0.15  # 最大降价 15%
    min_competitors: 2  # 最少竞争对手数才触发调整

# 置信度阈值
confidence_thresholds:
  accept: 0.7      # 自动接受任务
  review: 0.5      # 需要人工审核
  reject: 0.3      # 拒绝任务
